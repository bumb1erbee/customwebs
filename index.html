<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Заказать сайт</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            -webkit-text-size-adjust: 100%;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Press Start 2P', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
            background: #0a0a12;
            color: #ffffff;
            font-size: 12px;
            line-height: 1.8;
            -webkit-font-smoothing: antialiased;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://i.postimg.cc/hvw7SLZG/25aa1a16b78d63f639b04b8427d4f2d6.jpg') center/cover no-repeat;
            z-index: -2;
            filter: brightness(0.92) saturate(0.9) contrast(1.05);
            opacity: 1;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 18, 0.08);
            z-index: -1;
        }

        #scanlines-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            opacity: 0.9;
            will-change: transform;
        }

        #main-content {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 820px;
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.9s ease, transform 0.9s ease;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        #main-content.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .banner-container {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.03);
            transition: all 0.4s ease;
            position: relative;
            background: rgba(20, 18, 16, 0.3);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .banner-container:hover {
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 60px rgba(255, 255, 255, 0.06);
            transform: translateX(-4px);
        }

        .banner-image {
            width: 100%;
            height: auto;
            display: block;
            image-rendering: auto;
        }

        .section-card {
            position: relative;
            left: 0;
            padding: 28px 30px 26px;
            border: 2px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.02);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: visible;
            background: rgba(20, 18, 16, 0.35);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            opacity: 0;
            animation: cardAppear 0.7s ease forwards;
        }

        @keyframes cardAppear {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        .section-card:hover {
            left: -14px;
            background: rgba(40, 38, 36, 0.55);
            border-color: rgba(255, 255, 255, 0.25);
            box-shadow: 0 0 60px rgba(255, 255, 255, 0.08);
        }

        .section-card::before {
            content: '';
            position: absolute;
            top: -4px;
            left: -4px;
            right: -4px;
            bottom: -4px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            z-index: -1;
            filter: blur(12px);
            opacity: 0;
            transition: opacity 0.6s ease;
            border-radius: 2px;
            box-shadow: 
                0 0 20px rgba(255, 255, 255, 0.1),
                inset 0 0 20px rgba(255, 255, 255, 0.05);
        }

        .section-card:hover::before {
            opacity: 1;
            animation: neonBorderPulse 1.5s ease-in-out infinite;
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 
                0 0 40px rgba(255, 255, 255, 0.3),
                0 0 80px rgba(255, 255, 255, 0.15),
                inset 0 0 40px rgba(255, 255, 255, 0.1);
        }

        @keyframes neonBorderPulse {
            0%, 100% { 
                opacity: 0.7;
                filter: blur(12px);
                box-shadow: 
                    0 0 40px rgba(255, 255, 255, 0.3),
                    0 0 80px rgba(255, 255, 255, 0.15),
                    inset 0 0 40px rgba(255, 255, 255, 0.1);
            }
            50% { 
                opacity: 1;
                filter: blur(16px);
                box-shadow: 
                    0 0 60px rgba(255, 255, 255, 0.5),
                    0 0 100px rgba(255, 255, 255, 0.25),
                    inset 0 0 60px rgba(255, 255, 255, 0.15);
            }
        }

        .section-card::after {
            content: '';
            position: absolute;
            top: 6px;
            left: 6px;
            right: 6px;
            bottom: 6px;
            border: 1px dashed rgba(255, 255, 255, 0.1);
            z-index: -1;
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }

        .section-card:hover::after {
            opacity: 1;
        }

        .deco-bg {
            position: fixed;
            pointer-events: none;
            image-rendering: pixelated;
            z-index: 1;
            background: none !important;
            padding: 0 !important;
            border: none !important;
            box-shadow: none !important;
            opacity: 0.85;
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        .deco-bg:hover {
            opacity: 1;
            transform: scale(1.05);
        }

        .deco-bg-eshka {
            top: 40px;
            left: 40px;
            width: 130px;
            transform: rotate(-8deg);
        }

        .deco-bg-computer {
            bottom: 40px;
            right: 40px;
            width: 150px;
            transform: rotate(5deg);
        }

        .deco-bg-file {
            top: 50%;
            left: 30px;
            width: 120px;
            transform: translateY(-50%) rotate(-3deg);
        }

        .deco-img {
            background: none !important;
            padding: 0 !important;
            border: none !important;
            box-shadow: none !important;
            image-rendering: pixelated;
            pointer-events: none;
            position: absolute;
            z-index: 10;
            opacity: 0.6;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .deco-internet {
            width: 180px;
        }
        .deco-message { width: 75px; }

        .section-card .deco-internet {
            top: -30px;
            right: -30px;
            opacity: 0.7;
        }

        .section-card .deco-message {
            bottom: -30px;
            left: -30px;
            opacity: 0.7;
        }

        .section-card:hover .deco-img {
            opacity: 1 !important;
            transform: scale(1.15) rotate(var(--rotate, 0deg));
        }

        .section-card:hover .deco-internet { --rotate: 8deg; }
        .section-card:hover .deco-message { --rotate: -5deg; }

        h1 {
            font-size: 26px;
            font-family: 'Press Start 2P', monospace;
            font-weight: 400;
            letter-spacing: 4px;
            color: #ffffff;
            margin-bottom: 10px;
            padding-bottom: 16px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.05);
            text-shadow: 0 0 60px rgba(255, 255, 255, 0.12);
            position: relative;
            z-index: 2;
            margin-top: 20px;
        }

        .section {
            margin-bottom: 6px;
            position: relative;
            z-index: 2;
        }

        .section-title {
            display: inline-block;
            font-size: 11px;
            font-family: 'Press Start 2P', monospace;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #eeeeee;
            background: rgba(255, 255, 255, 0.04);
            padding: 4px 16px 4px 14px;
            margin-bottom: 14px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease;
        }

        .section-title:hover {
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.06);
            color: #ffffff;
        }

        .order-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
            z-index: 2;
            margin-top: 10px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-label {
            font-size: 11px;
            font-family: 'Press Start 2P', monospace;
            color: #eeeeee;
            letter-spacing: 1px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.03);
        }

        .form-label .optional {
            color: #888888;
            font-size: 9px;
            letter-spacing: 0.5px;
        }

        .form-input,
        .form-textarea {
            font-family: 'Press Start 2P', monospace;
            font-size: 11px;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid rgba(255, 255, 255, 0.08);
            padding: 12px 14px;
            transition: all 0.3s ease;
            outline: none;
            width: 100%;
            min-height: 44px;
            border-radius: 4px;
            resize: vertical;
        }

        .form-textarea {
            min-height: 140px;
            line-height: 1.6;
        }

        .form-textarea.question {
            min-height: 90px;
            border-style: dashed;
        }

        .form-input:focus,
        .form-textarea:focus {
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.06);
        }

        .form-input::placeholder,
        .form-textarea::placeholder {
            color: #888888;
            font-style: italic;
        }

        .form-divider {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 10px 0;
            color: #888888;
            font-size: 10px;
            letter-spacing: 2px;
        }

        .form-divider::before,
        .form-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
        }

        .submit-btn {
            background: rgba(30, 28, 24, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            font-family: 'Press Start 2P', monospace;
            font-size: 13px;
            letter-spacing: 3px;
            padding: 16px 40px;
            cursor: pointer;
            transition: all 0.4s ease;
            text-transform: uppercase;
            position: relative;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.04);
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.15);
            min-height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            align-self: flex-start;
        }

        .submit-btn::before {
            content: '';
            position: absolute;
            top: -4px;
            left: -4px;
            right: -4px;
            bottom: -4px;
            background: rgba(255, 255, 255, 0.08);
            filter: blur(10px);
            z-index: -1;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .submit-btn:hover {
            background: rgba(40, 36, 30, 0.7);
            border-color: rgba(255, 255, 255, 0.4);
            transform: scale(1.03);
            box-shadow: 0 0 60px rgba(255, 255, 255, 0.15);
            letter-spacing: 5px;
        }

        .submit-btn:hover::before {
            opacity: 1;
        }

        .submit-btn:active {
            transform: scale(0.94);
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .form-status {
            font-size: 11px;
            font-family: 'Press Start 2P', monospace;
            text-align: center;
            padding: 12px;
            border-radius: 4px;
            display: none;
            margin-top: 10px;
        }

        .form-status.success {
            display: block;
            color: #88ff88;
            background: rgba(136, 255, 136, 0.08);
            border: 1px solid rgba(136, 255, 136, 0.2);
        }

        .form-status.error {
            display: block;
            color: #ff8888;
            background: rgba(255, 136, 136, 0.08);
            border: 1px solid rgba(255, 136, 136, 0.2);
        }

        .portfolio-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(30, 28, 24, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            font-family: 'Press Start 2P', monospace;
            font-size: 11px;
            letter-spacing: 2px;
            padding: 14px 28px;
            margin-top: 18px;
            cursor: pointer;
            transition: all 0.4s ease;
            text-decoration: none;
            text-transform: uppercase;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.03);
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
            min-height: 48px;
            border-radius: 4px;
        }

        .portfolio-btn:hover {
            background: rgba(40, 36, 30, 0.75);
            border-color: rgba(255, 255, 255, 0.4);
            transform: scale(1.03);
            box-shadow: 0 0 50px rgba(255, 255, 255, 0.12);
            letter-spacing: 3px;
        }

        .portfolio-btn:active {
            transform: scale(0.94);
        }

        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1000;
            pointer-events: none;
        }

        @media (max-width: 768px), (hover: none) and (pointer: coarse) {
            body {
                padding: 12px;
                font-size: 11px;
            }

            #scanlines-canvas {
                display: none;
            }

            .deco-bg {
                opacity: 0.4;
                transition: none;
            }

            .deco-bg:hover {
                opacity: 0.4;
                transform: none;
            }

            .section-card:hover::before {
                animation: none;
                opacity: 0.8;
            }

            .section-card {
                padding: 22px 20px 20px;
            }

            .section-card::before {
                top: -3px;
                left: -3px;
                right: -3px;
                bottom: -3px;
                filter: blur(10px);
            }

            h1 {
                font-size: 22px;
                letter-spacing: 3px;
            }

            .section-title {
                font-size: 10px;
                padding: 3px 14px 3px 12px;
                letter-spacing: 1.5px;
            }

            .form-label {
                font-size: 10px;
            }

            .form-label .optional {
                font-size: 8px;
            }

            .form-input,
            .form-textarea {
                font-size: 10px;
                padding: 10px 12px;
            }

            .form-textarea.question {
                min-height: 70px;
            }

            .form-divider {
                font-size: 9px;
                margin: 6px 0;
            }

            .submit-btn {
                font-size: 12px;
                padding: 14px 30px;
                letter-spacing: 2px;
                min-height: 50px;
            }

            .portfolio-btn {
                font-size: 10px;
                padding: 12px 22px;
                min-height: 44px;
            }

            .deco-internet { width: 140px; }
            .deco-message { width: 58px; }

            .deco-bg-eshka { width: 100px; top: 30px; left: 25px; }
            .deco-bg-computer { width: 110px; bottom: 30px; right: 25px; }
            .deco-bg-file { width: 90px; left: 20px; }

            .section-card .deco-internet {
                top: -25px;
                right: -25px;
            }
            .section-card .deco-message {
                bottom: -25px;
                left: -25px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 8px;
                font-size: 10px;
            }

            .deco-bg-computer,
            .deco-bg-file {
                display: none;
            }

            .deco-bg-eshka {
                width: 60px;
                top: 15px;
                left: 10px;
                opacity: 0.3;
            }

            .section-card {
                padding: 16px 14px 14px;
                border-width: 1.5px;
            }

            .section-card::before {
                top: -2px;
                left: -2px;
                right: -2px;
                bottom: -2px;
                border-width: 1.5px;
                filter: blur(8px);
            }

            .section-card::after {
                top: 4px;
                left: 4px;
                right: 4px;
                bottom: 4px;
            }

            h1 {
                font-size: 18px;
                letter-spacing: 2px;
                margin-bottom: 6px;
                padding-bottom: 12px;
            }

            .section-title {
                font-size: 8px;
                padding: 2px 12px 2px 10px;
                margin-bottom: 10px;
                letter-spacing: 1px;
            }

            .form-label {
                font-size: 8px;
            }

            .form-label .optional {
                font-size: 7px;
            }

            .form-input,
            .form-textarea {
                font-size: 8px;
                padding: 8px 10px;
                min-height: 38px;
            }

            .form-textarea {
                min-height: 100px;
            }

            .form-textarea.question {
                min-height: 60px;
            }

            .form-divider {
                font-size: 7px;
                margin: 4px 0;
            }

            .submit-btn {
                font-size: 10px;
                padding: 12px 24px;
                min-height: 44px;
                letter-spacing: 1.5px;
            }

            .portfolio-btn {
                font-size: 8px;
                padding: 10px 18px;
                min-height: 38px;
                letter-spacing: 1px;
            }

            .deco-internet { width: 90px; }
            .deco-message { width: 40px; }

            .section-card .deco-internet {
                top: -18px;
                right: -18px;
            }
            .section-card .deco-message {
                bottom: -18px;
                left: -18px;
            }
        }

        @media (max-width: 360px) {
            .section-card {
                padding: 12px 10px 10px;
            }

            h1 {
                font-size: 14px;
                letter-spacing: 1.5px;
            }

            .deco-internet { width: 65px; }
            .deco-message { width: 30px; }

            .deco-bg-eshka { width: 50px; }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>

    <canvas id="scanlines-canvas"></canvas>
    <canvas id="particles-canvas"></canvas>

    <img class="deco-bg deco-bg-eshka" src="https://i.postimg.cc/ZYDRB2X8/e7b127d2aa8513bdc043dde3d5eb809d-no-bg-preview-(carve-photos).png" alt="ешка" loading="lazy">
    <img class="deco-bg deco-bg-computer" src="https://i.postimg.cc/tTJb9CRy/34b92c675ca0207a6c2255db2c7e0246-no-bg-preview-(carve-photos).png" alt="компьютер" loading="lazy">
    <img class="deco-bg deco-bg-file" src="https://i.postimg.cc/hGPv7n4H/146f0ed0a0edfdec013ce7cfab1c0f9e-no-bg-preview-(carve-photos).png" alt="файл" loading="lazy">

    <div id="main-content" class="visible">

        <div class="banner-container">
            <img class="banner-image" src="https://i.postimg.cc/V6VTjjzL/103b77ba0d520afcc0a399889a6a94d7.jpg" alt="баннер" loading="lazy">
        </div>

        <div class="section-card">
            <img class="deco-img deco-internet" src="https://i.postimg.cc/CKb6yyps/604378ef899501c7493367e0edfffb97-fotor-bg-remover-20260730182418.png" alt="internet" loading="lazy">
            <h1>заказать сайт</h1>
            <div class="section">
                <div class="section-title">⌲ опишите свою идею</div>
                <form class="order-form" id="orderForm">
                    <div class="form-group">
                        <label class="form-label" for="orderName">ваше имя / никнейм</label>
                        <input class="form-input" type="text" id="orderName" required placeholder="например, Шмель">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="orderContact">контакт (телеграм, дискорд, почта)</label>
                        <input class="form-input" type="text" id="orderContact" required placeholder="@ваш_никнейм">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="orderBudget">бюджет (необязательно)</label>
                        <input class="form-input" type="text" id="orderBudget" placeholder="самая оптимальная для вас стоимость">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="orderDescription">опишите, какой сайт вы хотите</label>
                        <textarea class="form-textarea" id="orderDescription" required placeholder="Расскажите о стиле, цветах, разделах, референсах, сроках..."></textarea>
                    </div>
                    <button class="submit-btn" type="submit" id="submitBtn">отправить заказ</button>
                    <div class="form-status" id="formStatus"></div>

                    <div class="form-divider">или</div>

                    <div class="form-group">
                        <label class="form-label" for="orderQuestion">задать вопрос <span class="optional">(необязательно)</span></label>
                        <textarea class="form-textarea question" id="orderQuestion" placeholder="Если у вас есть вопрос — напишите его здесь, и я отвечу вам в указанном контакте..."></textarea>
                    </div>
                </form>
            </div>
            <img class="deco-img deco-message" src="https://i.postimg.cc/Y0LrSYk0/e599e3237fffd79d7ef73b1d86f81c8a-fotor-bg-remover-20260730182543.png" alt="message" loading="lazy">
            <a class="portfolio-btn" href="https://bumb1erbee.github.io/portfolio" target="_blank">Посмотреть портфолио</a>
        </div>

    </div>

    <script>
        const PROXY_URL = 'https://customwebs.makvirter.workers.dev/';

        const isMobile = window.matchMedia('(max-width: 768px), (hover: none) and (pointer: coarse)').matches;

        const scanCanvas = document.getElementById('scanlines-canvas');
        const scanCtx = scanCanvas.getContext('2d');
        let scanlines = [];
        let scanFrameId = null;

        function resizeScanCanvas() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            scanCanvas.width = window.innerWidth * dpr;
            scanCanvas.height = window.innerHeight * dpr;
            scanCanvas.style.width = window.innerWidth + 'px';
            scanCanvas.style.height = window.innerHeight + 'px';
            scanCtx.setTransform(1, 0, 0, 1, 0, 0);
            scanCtx.scale(dpr, dpr);
        }

        function initScanlines() {
            const count = window.innerWidth < 480 ? 6 : 10;
            scanlines = [];
            for (let i = 0; i < count; i++) {
                const line = new Scanline();
                line.y = Math.random() * window.innerHeight;
                scanlines.push(line);
            }
        }

        class Scanline {
            constructor() {
                this.reset();
                this.flickerTimer = Math.random() * 100;
                this.flickerSpeed = Math.random() * 0.5 + 0.2;
            }
            reset() {
                this.x = 0;
                this.y = Math.random() * window.innerHeight;
                this.width = window.innerWidth;
                const multiplier = Math.random() < 0.5 ? 3 : 4;
                this.height = (Math.random() * 9 + 9) * multiplier;
                this.opacity = Math.random() * 0.2 + 0.1;
                this.isVisible = true;
                this.flickerTimer = Math.random() * 100;
            }
            update() {
                this.flickerTimer += this.flickerSpeed;
                if (this.flickerTimer > 60) {
                    this.flickerTimer = 0;
                    if (Math.random() < 0.25) this.isVisible = !this.isVisible;
                    if (Math.random() < 0.08) this.y += (Math.random() - 0.5) * 4;
                    if (Math.random() < 0.2) this.opacity = Math.random() * 0.2 + 0.1;
                }
                if (this.y < -10) this.y = -10;
                if (this.y > window.innerHeight + 10) this.y = window.innerHeight + 10;
            }
            draw() {
                if (!this.isVisible) return;
                scanCtx.fillStyle = `rgba(240, 235, 225, ${this.opacity})`;
                scanCtx.fillRect(this.x, this.y, this.width, this.height);
                if (this.opacity > 0.12) {
                    scanCtx.shadowBlur = 20;
                    scanCtx.shadowColor = `rgba(240, 235, 225, ${this.opacity * 0.25})`;
                    scanCtx.fillRect(this.x, this.y, this.width, this.height);
                    scanCtx.shadowBlur = 0;
                }
            }
        }

        function animateScanlines() {
            scanCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
            scanlines.forEach(line => { line.update(); line.draw(); });
            scanFrameId = requestAnimationFrame(animateScanlines);
        }

        const particleCanvas = document.getElementById('particles-canvas');
        const particleCtx = particleCanvas.getContext('2d');
        let burstParticles = [];
        let particleFrameId = null;

        function resizeParticleCanvas() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            particleCanvas.width = window.innerWidth * dpr;
            particleCanvas.height = window.innerHeight * dpr;
            particleCanvas.style.width = window.innerWidth + 'px';
            particleCanvas.style.height = window.innerHeight + 'px';
            particleCtx.setTransform(1, 0, 0, 1, 0, 0);
            particleCtx.scale(dpr, dpr);
        }

        class BurstParticle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 4 + 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.size = Math.floor(Math.random() * 4) + 2;
                this.life = 1;
                this.decay = Math.random() * 0.015 + 0.008;
                this.color = '#ffffff';
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vx *= 0.97;
                this.vy *= 0.97;
                this.life -= this.decay;
            }
            draw() {
                particleCtx.globalAlpha = this.life * 0.9;
                particleCtx.shadowBlur = 25;
                particleCtx.shadowColor = `rgba(255, 255, 255, ${this.life * 0.6})`;
                particleCtx.fillStyle = this.color;
                const s = this.size;
                particleCtx.fillRect(this.x - s/2, this.y - s/2, s, s);
                particleCtx.shadowBlur = 0;
                particleCtx.globalAlpha = 1;
            }
        }

        function createBurst(x, y, count) {
            const maxCount = isMobile ? 15 : 30;
            const limitedCount = Math.min(count || maxCount, maxCount);
            for (let i = 0; i < limitedCount; i++) {
                burstParticles.push(new BurstParticle(x, y));
            }
        }

        function animateParticles() {
            particleCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
            const maxStars = isMobile ? 80 : 200;
            if (burstParticles.length > maxStars) {
                burstParticles = burstParticles.slice(-Math.floor(maxStars * 0.7));
            }
            for (let i = burstParticles.length - 1; i >= 0; i--) {
                const p = burstParticles[i];
                p.update();
                p.draw();
                if (p.life <= 0) burstParticles.splice(i, 1);
            }
            particleFrameId = requestAnimationFrame(animateParticles);
        }

        const orderForm = document.getElementById('orderForm');
        const submitBtn = document.getElementById('submitBtn');
        const formStatus = document.getElementById('formStatus');

        function init() {
            resizeScanCanvas();
            resizeParticleCanvas();
            if (!isMobile) {
                initScanlines();
                animateScanlines();
            }
            animateParticles();

            window.addEventListener('resize', () => {
                resizeScanCanvas();
                resizeParticleCanvas();
                if (!isMobile) {
                    initScanlines();
                }
            });
        }

        orderForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('orderName').value.trim();
            const contact = document.getElementById('orderContact').value.trim();
            const budget = document.getElementById('orderBudget').value.trim();
            const description = document.getElementById('orderDescription').value.trim();
            const question = document.getElementById('orderQuestion').value.trim();

            formStatus.className = 'form-status';
            formStatus.textContent = '';
            submitBtn.disabled = true;
            submitBtn.textContent = 'отправка...';

            try {
                const response = await fetch(PROXY_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        name, 
                        contact, 
                        budget, 
                        description,
                        question,
                        lang: 'ru'
                    })
                });

                if (response.ok) {
                    alert('✦ Заказ успешно отправлен! Скоро с вами свяжутся ✦');
                    orderForm.reset();
                    formStatus.className = 'form-status success';
                    formStatus.textContent = '✦ заказ отправлен! скоро свяжусь ✦';
                } else {
                    formStatus.className = 'form-status error';
                    formStatus.textContent = '✗ ошибка отправки. попробуй ещё раз';
                }
            } catch (error) {
                formStatus.className = 'form-status error';
                formStatus.textContent = '✗ ошибка сети. проверь подключение';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'отправить заказ';
            }
        });

        document.addEventListener('click', (e) => {
            if (e.target.closest('input, textarea, button, a')) return;
            createBurst(e.clientX, e.clientY);
            if (!isMobile) {
                setTimeout(() => { createBurst(e.clientX, e.clientY, 15); }, 50);
            }
        });

        if (isMobile) {
            document.addEventListener('touchstart', (e) => {
                if (e.target.closest('input, textarea, button, a')) return;
                const touch = e.touches[0];
                if (touch) {
                    createBurst(touch.clientX, touch.clientY);
                }
            }, { passive: true });
        }

        if (!isMobile) {
            document.querySelectorAll('.section-card').forEach(el => {
                el.addEventListener('mouseenter', (e) => {
                    const rect = el.getBoundingClientRect();
                    for (let i = 0; i < 12; i++) {
                        const x = rect.left + Math.random() * rect.width;
                        const y = rect.top + Math.random() * rect.height;
                        const p = new BurstParticle(x, y);
                        p.size = Math.floor(Math.random() * 2) + 1;
                        p.decay = Math.random() * 0.03 + 0.015;
                        p.vx = (Math.random() - 0.5) * 1.5;
                        p.vy = (Math.random() - 0.5) * 1.5;
                        burstParticles.push(p);
                    }
                });
            });

            document.querySelectorAll('.banner-container, .submit-btn, .portfolio-btn').forEach(el => {
                el.addEventListener('mouseenter', (e) => {
                    const rect = el.getBoundingClientRect();
                    for (let i = 0; i < 6; i++) {
                        const x = rect.left + Math.random() * rect.width;
                        const y = rect.top + Math.random() * rect.height;
                        const p = new BurstParticle(x, y);
                        p.size = Math.floor(Math.random() * 3) + 1;
                        p.decay = Math.random() * 0.025 + 0.01;
                        p.vx = (Math.random() - 0.5) * 2.5;
                        p.vy = (Math.random() - 0.5) * 2.5;
                        burstParticles.push(p);
                    }
                });
            });
        }

        init();
    </script>

</body>
</html>
